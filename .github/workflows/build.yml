name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '*.md'
  workflow_dispatch:

jobs:
  # ── C++ ARM64 交叉编译 ──
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config:
          - {name: "MNN",          cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=OFF -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=OFF"}
          - {name: "MNN+ORT",      cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=ON -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=OFF", ort: true}
          - {name: "MNN+LLAMA",    cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=OFF -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=ON"}

    steps:
      - uses: actions/checkout@v4

      # 公共子模块(仅 build 所需;私有 MobileLLM 不参与 CI build、无凭据无法 clone,
      # 显式排除避免 checkout 失败。MobileLLM 需验证时改 public 或配 PAT)
      - name: Init public submodules
        run: |
          git submodule update --init third_party/MNN third_party/llama.cpp third_party/onnxruntime third_party/tvm

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # ── ORT: restore cache or build ──
      - name: Get ORT commit
        if: matrix.config.ort
        id: ort-hash
        run: echo "hash=$(git -C third_party/onnxruntime rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Restore ORT cache
        if: matrix.config.ort
        id: ort-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/onnxruntime/build/Android/Release/libonnxruntime.so
          key: ort-${{ steps.ort-hash.outputs.hash }}-r26d

      - name: Build ORT for Android
        if: matrix.config.ort && steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          echo "🔨 Building ONNX Runtime for Android ARM64 (this takes ~30 min, cached after first run)..."
          cd third_party/onnxruntime
          ./build.sh \
            --android --android_abi arm64-v8a --android_api 29 \
            --android_ndk_path ${{ steps.ndk.outputs.ndk-path }} \
            --build_shared_lib --config Release \
            --skip_tests --parallel --skip_submodule_sync \
            --cmake_extra_defines CMAKE_CXX_STANDARD=20
          echo "✅ ORT built"

      - name: Save ORT cache
        if: matrix.config.ort && steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/onnxruntime/build/Android/Release/libonnxruntime.so
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}

      # ── Build benchmark ──
      - name: Configure CMake
        run: |
          cmake -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.cmake }}

      - name: Build
        run: cmake --build build_android --target benchmark_inference -j$(nproc)

      - name: Verify binary
        run: |
          file build_android/src/cnn/benchmark_inference
          echo "✅ ${{ matrix.config.name }}"

  # ── benchctl Python 回归测试 ──
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install click pyyaml

      - name: CLI smoke test
        run: |
          python -m benchctl --help
          for cmd in db run history verify export; do
            python -m benchctl $cmd --help > /dev/null 2>&1 || echo "⚠️  $cmd"
          done
          echo "✅ CLI smoke test"

      - name: Database round-trip
        run: |
          python -m benchctl db init
          python3 -c "
          import json; from benchctl.db import Database
          db = Database()
          db.insert({'run_id':'','timestamp':'2026-07-25T00:00:00Z','git_commit':'test','track':'cnn','framework':'mnn','model':'resnet50','precision':'fp32','threads':4,'warmup':10,'test_runs':50,'metrics':{'p50_ms':8.5,'p99_ms':9.0,'throughput_fps':118}})
          db.close()
          "
          python -m benchctl db stats
          python -m benchctl history mnn resnet50
          python -m benchctl export resnet50 -f mnn --format json
          echo "✅ DB round-trip"

  # ── 代码风格检查 ──
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang-format (C++)
        run: |
          sudo apt-get install -y clang-format
          find src/ -name "*.cpp" -o -name "*.h" | sort | xargs clang-format --dry-run
          echo "✅ C++ formatting OK"

      - name: ruff (Python)
        run: |
          pip install ruff
          ruff check --select E,F,I --ignore E501 benchctl/ || true
          echo "✅ Python lint done"
