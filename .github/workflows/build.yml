name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '*.md'
  workflow_dispatch:

jobs:
  # ── C++ ARM64 交叉编译 ──
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config:
          - {name: "MNN+ORT",      cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=ON -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=OFF"}
          - {name: "MNN+ORT+LLAMA", cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=ON -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=ON"}
          - {name: "MNN-only",     cmake: "-DBENCHMARK_MNN=ON -DBENCHMARK_ORT=OFF -DBENCHMARK_TVM=OFF -DBENCHMARK_LLAMACPP=OFF"}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Configure CMake
        run: |
          cmake -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.cmake }}

      - name: Build
        run: cmake --build build_android --target benchmark_inference -j$(nproc)

      - name: Verify binary
        run: |
          file build_android/src/cnn/benchmark_inference
          echo "✅ ${{ matrix.config.name }}"

  # ── benchctl Python 回归测试 ──
  regression:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install click pyyaml

      - name: CLI smoke test
        run: |
          python -m benchctl --help
          python -m benchctl --version
          python -m benchctl db --help
          python -m benchctl run --help
          python -m benchctl history --help
          python -m benchctl verify --help
          python -m benchctl export --help
          echo "✅ All CLI commands work"

      - name: Database round-trip
        run: |
          python -m benchctl db init
          python -m benchctl db stats
          # 模拟插入数据
          python3 -c "
          import json
          from benchctl.db import Database
          db = Database()
          db.insert({
              'run_id': '', 'timestamp': '2026-07-25T00:00:00Z',
              'git_commit': 'test1234', 'track': 'cnn',
              'framework': 'mnn', 'model': 'resnet50',
              'precision': 'fp32', 'threads': 4,
              'warmup': 10, 'test_runs': 50,
              'metrics': {'p50_ms': 8.5, 'p99_ms': 9.0, 'throughput_fps': 118}
          })
          db.close()
          "
          python -m benchctl db stats
          python -m benchctl history mnn resnet50 --last 3
          python -m benchctl export resnet50 -f mnn --format json
          echo "✅ DB round-trip OK"

  # ── 代码风格检查 ──
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang-format (C++)
        run: |
          sudo apt-get install -y clang-format
          find src/ -name "*.cpp" -o -name "*.h" | sort | xargs clang-format --dry-run
          echo "✅ C++ formatting OK"

      - name: ruff (Python)
        run: |
          pip install ruff
          ruff check --select E,F,I --ignore E501 benchctl/ || true
          echo "✅ Python lint done"
